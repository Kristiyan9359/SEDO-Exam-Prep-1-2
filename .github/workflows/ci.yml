
name: .NET CI

on:
  push:
    branches:
      - develop
      - "feature/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore dependencies
        run: dotnet restore SoftUniBazar.sln

      - name: Build
        run: dotnet build SoftUniBazar.sln --no-restore

      - name: Test
        run: dotnet test SoftUniBazar.sln --no-build --verbosity normal
